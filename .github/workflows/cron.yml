name: Validate integration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
  regression:
    name: Metadata and HA regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: requirements-test-target.lock
      - name: Validate manifest and repository settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_metadata.py --check-github
      - name: Install test dependencies
        run: python -m pip install -r requirements-test-target.lock
      - name: Install hash-pinned API requirement
        run: |
          python - <<'PYTHON'
          import json
          import subprocess
          import sys
          from pathlib import Path
          manifest = json.loads(Path("custom_components/owlet/manifest.json").read_text())
          subprocess.run([sys.executable, "-m", "pip", "install", "--no-deps", *manifest["requirements"]], check=True)
          PYTHON
      - name: Run offline integration regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -c pytest.ini tests/test_maintenance.py -q --timeout=20
